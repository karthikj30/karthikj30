name: Generate Profile Graphics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20     # was 10; docs recommend 20

    steps:
      - uses: actions/checkout@v4

      - name: Generate pacman graphs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          theme: algolia
          no-frame: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all files exist
        run: ls -la dist/

      - name: Push graphics to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_files: true      # ← stops one failure wiping the others
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}