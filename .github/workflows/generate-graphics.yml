name: Generate Profile Graphics

on:
  schedule:
    - cron: "0 0 * * *"        # Runs automatically once a day
  workflow_dispatch:            # Lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          theme: algolia
          no-frame: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Both generators write into the SAME dist/ folder above, so this single
      # push step commits everything together — nothing gets overwritten.
      - name: Push all graphics to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
