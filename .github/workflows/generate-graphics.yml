name: Generate Profile Graphics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20     # was 10; docs recommend 20

    steps:
      - uses: actions/checkout@v4

      - name: Generate pacman graphs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # continue-on-error matters here: this step reads user-level GraphQL data
      # and had been failing daily since 2026-07-22 with "Failed to fetch user
      # info". Because it was blocking, the job aborted before the push step, so
      # the pacman graphs stopped deploying too. A trophy failure must never take
      # the rest of the graphics down with it.
      - name: Generate trophy.svg
        continue-on-error: true
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          theme: algolia
          no-frame: true
          # Without these the action defaults to cols=-1, which lays every
          # trophy out in ONE row. Each new trophy makes the SVG wider, so
          # GitHub scales the whole strip down and they all get smaller.
          # A fixed grid keeps each panel at full 115px and wraps instead.
          max-cols: 4
          max-rows: 3
          # secrets.GITHUB_TOKEN is repo-scoped and cannot read the user-level
          # data this action needs. Set a TROPHY_TOKEN repo secret (a PAT with
          # read:user) and it gets used instead; the fallback just keeps the
          # workflow valid until that secret exists.
          token: ${{ secrets.TROPHY_TOKEN || secrets.GITHUB_TOKEN }}

      # The deploy step force-pushes dist/ as the ENTIRE contents of the output
      # branch, so the branch always ends up equal to dist/. keep_files does not
      # change that. Any generator that fails or silently no-ops therefore
      # deletes its artifact from the branch and the README image starts 404ing.
      # Both graphics have been lost this way. So before deploying, backfill any
      # missing artifact with the copy that is already published.
      - name: Backfill any artifact this run did not produce
        run: |
          mkdir -p dist
          missing=0
          for f in trophy.svg pacman-contribution-graph.svg pacman-contribution-graph-dark.svg; do
            if [ -s "dist/$f" ]; then
              echo "$f: generated fresh"
            elif curl -fsSL --retry 3 -o "dist/$f" \
                "https://raw.githubusercontent.com/${{ github.repository }}/output/$f"; then
              echo "::warning::$f was not generated this run; re-publishing the last good copy."
            else
              rm -f "dist/$f"
              missing=1
              echo "::warning::$f was not generated and no published copy exists. Its README image will 404."
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::warning::Trophy generation needs a TROPHY_TOKEN secret (PAT with read:user)."
          fi

      - name: Verify all files exist
        run: |
          ls -la dist/ || { echo "::error::dist/ missing - no graphics generated"; exit 1; }
          # Refuse to publish an empty dist/, which would wipe every artifact.
          [ -n "$(ls -A dist/)" ] || { echo "::error::dist/ is empty - refusing to deploy and wipe the output branch"; exit 1; }

      - name: Push graphics to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_files: true      # ← stops one failure wiping the others
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}