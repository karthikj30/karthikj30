name: Generate Profile Graphics

on:
  schedule:
    # Every 30 minutes rather than once a day. A daily run meant the streak and
    # activity cards showed yesterday's figures all day, and picked up a partial
    # count whenever GitHub had not finished indexing the previous day by 00:00.
    # GitHub may delay scheduled runs under load, so treat this as a floor, not
    # a guarantee.
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20     # was 10; docs recommend 20

    steps:
      - uses: actions/checkout@v4

      - name: Generate pacman graphs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Defaults to github.token, which is repo-scoped and sees only a
          # subset of the contribution calendar - the rendered maze came out
          # far sparser than the real graph. Reuse the user-scoped PAT.
          github_token: ${{ secrets.STATS_TOKENS || secrets.TROPHY_TOKEN || github.token }}

      # continue-on-error matters here: this step reads user-level GraphQL data
      # and had been failing daily since 2026-07-22 with "Failed to fetch user
      # info". Because it was blocking, the job aborted before the push step, so
      # the pacman graphs stopped deploying too. A trophy failure must never take
      # the rest of the graphics down with it.
      - name: Generate trophy.svg
        continue-on-error: true
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          theme: algolia
          no-frame: true
          # Panels are 115px with 10px margins, so the SVG is 115*cols +
          # 10*(cols-1) wide. The README renders it at width="70%" of an ~880px
          # column, about 616px. At 4 cols the SVG is only 490px, so the browser
          # scales it UP 1.26x and the trophies render oversized at ~145px. At
          # 5 cols it is 615px, a 1.00x scale and true 115px panels, and the
          # current 9 trophies wrap to a tidy 5 + 4.
          max-cols: 5
          max-rows: 3
          # secrets.GITHUB_TOKEN is repo-scoped and cannot read the user-level
          # data this action needs. Either STATS_TOKENS or TROPHY_TOKEN is used
          # when present; the last fallback only keeps the workflow valid while
          # neither secret exists.
          token: ${{ secrets.STATS_TOKENS || secrets.TROPHY_TOKEN || secrets.GITHUB_TOKEN }}

      # Replaces streak-stats.demolab.com and github-readme-activity-graph,
      # both shared public instances that started returning "failed to retrieve
      # contributions" once their own GitHub tokens hit limits. Same data, same
      # PAT the steps above already use, no third party in the path.
      # Non-blocking on purpose: this workflow's job is publishing images, and a
      # red test should surface as a warning rather than abort the run before
      # the deploy step. Point at the file, not the directory - a directory run
      # also tries to execute contrib-cards.mjs itself, which exits 1 without a
      # token and looks like a test failure.
      - name: Test the card generator
        continue-on-error: true
        run: node --test .github/scripts/contrib-cards.test.mjs

      - name: Generate streak + activity cards
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKENS || secrets.TROPHY_TOKEN || github.token }}
        run: node .github/scripts/contrib-cards.mjs "${{ github.repository_owner }}" dist

      # The deploy step force-pushes dist/ as the ENTIRE contents of the output
      # branch, so the branch always ends up equal to dist/. keep_files does not
      # change that. Any generator that fails or silently no-ops therefore
      # deletes its artifact from the branch and the README image starts 404ing.
      # Both graphics have been lost this way. So before deploying, backfill any
      # missing artifact with the copy that is already published.
      - name: Backfill any artifact this run did not produce
        run: |
          mkdir -p dist
          missing=0
          for f in trophy.svg pacman-contribution-graph.svg pacman-contribution-graph-dark.svg \
                   streak.svg activity-graph.svg stats.json cards-check.txt; do
            if [ -s "dist/$f" ]; then
              echo "$f: generated fresh"
            elif curl -fsSL --retry 3 -o "dist/$f" \
                "https://raw.githubusercontent.com/${{ github.repository }}/output/$f"; then
              echo "::warning::$f was not generated this run; re-publishing the last good copy."
            else
              rm -f "dist/$f"
              missing=1
              echo "::warning::$f was not generated and no published copy exists. Its README image will 404."
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::warning::Trophy generation needs a STATS_TOKENS or TROPHY_TOKEN secret (a PAT with repo, read:user, read:org)."
          fi

      - name: Verify all files exist
        run: |
          ls -la dist/ || { echo "::error::dist/ missing - no graphics generated"; exit 1; }
          # Refuse to publish an empty dist/, which would wipe every artifact.
          [ -n "$(ls -A dist/)" ] || { echo "::error::dist/ is empty - refusing to deploy and wipe the output branch"; exit 1; }

      # Checks the live, externally-served cards. The URLs are read out of
      # README.md rather than written here: an earlier version hand-copied them
      # and drifted, missing hide_border, the colours and cache_seconds. Those
      # differences make a distinct cache entry, so the check was querying a URL
      # nobody renders - it reported 10 issues while the real card showed 33.
      # Reading them from the README means it always tests what the profile
      # actually serves, and keeps working when the URLs change.
      - name: Check the live cards render
        continue-on-error: true
        run: |
          : > dist/cards-check.txt
          mapfile -t urls < <(grep -oE 'src="https://[^"]+/api[^"]*"' README.md \
                              | sed 's/^src="//; s/"$//' | sort -u)
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "::warning::no card URLs found in README.md - check the src pattern"
            echo "no card URLs found in README.md" >> dist/cards-check.txt
          fi
          for u in "${urls[@]}"; do
            code=$(curl -s -o /tmp/card.svg -w '%{http_code}' --max-time 30 "$u") || code=000
            short="${u#https://}"; short="${short%%\?*}"
            if [ "$code" != "200" ] || ! grep -q "<svg" /tmp/card.svg; then
              echo "FAIL http=${code} ${short}" | tee -a dist/cards-check.txt
              head -c 200 /tmp/card.svg >> dist/cards-check.txt || true
              echo >> dist/cards-check.txt
              echo "::warning::card failed: http=${code} ${short}"
            else
              echo "OK   http=${code} bytes=$(wc -c < /tmp/card.svg) ${short}" \
                | tee -a dist/cards-check.txt
              # The text the card rendered, so figures are verifiable without
              # opening the image.
              grep -oE '>[^<>]+</text>' /tmp/card.svg | sed 's/^>//;s|</text>||' \
                | paste -sd'|' - | cut -c1-300 | tee -a dist/cards-check.txt
            fi
          done

      - name: Push graphics to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          # No keep_files here: the action rejects it as an unknown input and
          # warns every run. It never protected anything - the deploy always
          # force-pushes dist/ as the whole branch. The backfill step above is
          # what actually keeps an artifact from disappearing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}